<script>

/* ---- smart search ---- */
const SYN=[['hoodie','hoodies','هودي','هوديز','سويت شيرت','sweatshirt','sweatshirts','سويتشيرت'],['pullover','pullovers','بلوفر','بلوفرات','كنزه','كنزة','sweater','knit','كنزات'],['jacket','jackets','جاكيت','جاكيتات','جاكت'],['coat','coats','بالطو','معطف','بالطوه'],['shirt','shirts','overshirt','overshirts','قميص','قمصان'],['tshirt','t-shirt','t-shirts','tee','تيشيرت','تيشرت','تي شيرت'],['polo','polos','بولو'],['jeans','denim','جينز'],['pants','trousers','sweatpants','بنطلون','بنطلونات','سويت بانتس','بنطال'],['cap','caps','hat','كاب','قبعه','طاقيه','كابات'],['black','اسود','أسود'],['white','ابيض','أبيض'],['grey','gray','رمادي','رصاصي'],['navy','كحلي','كحلى'],['burgundy','بوردو','عنابي'],['sugar','سكري','بيج','beige'],['olive','زيتي','زيتوني'],['brown','بني','قهوه','قهوة'],['blue','ازرق','أزرق'],['red','احمر','أحمر'],['green','اخضر','أخضر'],['half','نص','هاف'],['neck','نك','رقبه','ياقه']];
const SALE=['sale','offer','offers','discount','خصم','تخفيض','عروض','عرض','اوفر','أوفر','تصفيه','تصفية'];
function nz(x){return String(x||'').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\p{L}\p{N}\s-]/gu,' ').replace(/\s+/g,' ').trim()}
const SYNZ=SYN.map(g=>g.map(nz));
const stem=w=>w.length>3&&w.startsWith('ال')?w.slice(2):w;
function lev(a,b,m){if(Math.abs(a.length-b.length)>m)return m+1;let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const c=[i];let mn=i;for(let j=1;j<=b.length;j++){const v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));c.push(v);if(v<mn)mn=v}if(mn>m)return m+1;p=c}return p[b.length]}
function sIndex(p){const cat=S.cats.find(c=>c.en==p.c)||{};const name=nz((p.n.en||'')+' '+(p.n.ar||''));const meta=nz((p.c||'')+' '+(cat.ar||'')+' '+String(p.cl||'').replace(/,/g,' '));return {name,nt:name.split(' ').map(stem),meta,mt:meta.split(' ').map(stem)}}
function sTok(w,ix,p){let best=0;const syn=SYNZ.find(g=>g.includes(w));
const chk=(t,base)=>{for(const x of ix.nt){if(x==t)return base+4;if(x.startsWith(t))return base+2;if(t.length>=3&&x.includes(t))return base}return 0};
best=Math.max(best,chk(w,6));
for(const x of ix.mt){if(x==w)best=Math.max(best,5);else if(w.length>=3&&x.startsWith(w))best=Math.max(best,4)}
if(syn)for(const g of syn){if(g==w)continue;best=Math.max(best,chk(g,5)-1);for(const x of ix.mt)if(x==g)best=Math.max(best,4)}
if(!best&&w.length>=4){const m=w.length>=6?2:1;for(const x of ix.nt.concat(ix.mt)){if(x.length>=3&&lev(w,x,m)<=m){best=3;break}}}
if(!best&&SALE.includes(w)&&p.s>0)best=4;
return best}
function smart(list,query){const toks=nz(query).split(' ').map(stem).filter(Boolean);if(!toks.length)return list.map(p=>({p,sc:0}));
const out=[];for(const p of list){const ix=sIndex(p);let tot=0,hit=0;for(const w of toks){const v=sTok(w,ix,p);if(v){tot+=v;hit++}}
if(hit==toks.length)out.push({p,sc:tot+(p.s>0?.5:0)-(p.out?1:0)});else if(hit&&toks.length>1&&hit>=toks.length-1)out.push({p,sc:tot*.4,part:1})}
return out.sort((a,b)=>b.sc-a.sc)}
function hl(text,query){const t=esc(text);const ws=String(query).trim().split(/\s+/).filter(w=>w.length>1).map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));if(!ws.length)return t;try{return t.replace(new RegExp('('+ws.join('|')+')','gi'),'<mark>$1</mark>')}catch(e){return t}}
const sdEl=document.createElement('div');sdEl.className='sd';sdEl.id='sd';$('.sb').appendChild(sdEl);let sdAct=-1,sdRes=[];
function sdrop(){const qq=($('#sq').value||'').trim();if(!qq){sdEl.classList.remove('on');sdEl.innerHTML='';sdRes=[];return}
const L=lang=='ar',res=smart(vis(),qq);sdRes=res;sdAct=-1;
if(!res.length){sdEl.innerHTML=`<div class="sn">${L?'مفيش نتايج لـ':'No results for'} "${esc(qq)}"<br><small>${L?'جرّب كلمة تانية زي: بلوفر، هودي، اسود':'Try: pullover, hoodie, black'}</small></div>`;sdEl.classList.add('on');return}
const top=res.slice(0,6);
sdEl.innerHTML=(res[0].part?`<div class="sh">${L?'نتايج قريبة':'Similar results'}</div>`:'')+top.map(({p})=>`<div class="sr" role="button" tabindex="-1" data-sid="${p.id}"><div class="st2">${ph(p,0)}</div><div class="si"><b>${hl(tr(p.n),qq)}</b><small>${esc(cname(p.c))}${p.out?' · '+(L?'نفدت الكمية':'Sold out'):''}</small><span>${money(price(p))}</span>${p.s>0?` <small style="display:inline;text-decoration:line-through">${money(p.p)}</small>`:''}</div></div>`).join('')+(res.length>top.length?`<button class="sa" data-sall>${L?'عرض كل النتايج':'Show all results'} (${res.length})</button>`:'');
sdEl.classList.add('on')}
document.addEventListener('click',e=>{const r=e.target.closest('.sr[data-sid]');if(r){e.stopPropagation();sdEl.classList.remove('on');product(+r.dataset.sid);return}
if(e.target.closest('[data-sall]')){sdEl.classList.remove('on');document.getElementById('cats').scrollIntoView({behavior:'smooth'});return}
if(!e.target.closest('.sb'))sdEl.classList.remove('on')},true);

else if(e.key=='Enter'){e.preventDefault();if(sdAct>=0&&rows[sdAct]){sdEl.classList.remove('on');product(+rows[sdAct].dataset.sid)}else{sdEl.classList.remove('on');document.getElementById('cats').scrollIntoView({behavior:'smooth'})}}
else if(e.key=='Escape')sdEl.classList.remove('on')});
</script>

const nm=user.displayName||(AC.prof&&AC.prof.name)||'',pw=(user.providerData||[]).some(p=>p.providerId=='password'),ver=user.emailVerified;
const tabs=[['orders',L2('طلباتي','Orders')],['prof',L2('بياناتي','Details')],['favs',L2('المفضلة','Wishlist')]];
let b='';if(AC.tab=='orders'){b=AC.orders===null?'<p class="mut">...</p>':AC.orders.length?AC.orders.map(o=>`<div class="oc"><div class="oh"><b>${esc(o.id)}</b><span class="sc ${esc(o.status)}">${cst(o.status)}</span></div><small class="mut">${fmtD(o.t)}</small><div class="mut" style="font-size:13px;margin:6px 0">${(o.items||[]).map(i=>`${esc(iname(i))} ×${esc(i.qty)}`).join('<br>')}</div><div class="oh"><b>${money(o.total||0)}</b><button class="lnk" style="margin:0" data-ac="trk:${esc(o.id)}">${L2('تتبع الطلب','Track')}</button></div></div>`).join(''):`<p class="mut">${L2('لسه ما عملتش أي طلب.','No orders yet.')}</p>`}
else if(AC.tab=='prof'){const pf=AC.prof||{};b=`<form id="pf" style="display:grid;gap:8px"><input id="pn" placeholder="${L2('الاسم','Name')}" value="${esc(pf.name||nm)}" autocomplete="name"><input id="pp" type="tel" placeholder="${L2('رقم الموبايل','Phone')}" value="${esc(pf.phone||'')}" autocomplete="tel" dir="ltr" style="text-align:start"><select id="pg"><option value="">${t('gov')}</option>${GOV.map((g,k)=>`<option value="${k}"${pf.g===k?' selected':''}>${g[lang=='ar'?0:1]}</option>`).join('')}</select><input id="pa" placeholder="${t('ad')}" value="${esc(pf.address||'')}" autocomplete="street-address"><button class="btn dark" type="submit">${L2('حفظ البيانات','Save')}</button></form><small class="mut">${L2('بياناتك بتتملى تلقائي في السلة.','These auto-fill your cart.')}</small>`}
else b=`<button class="btn dark" data-ac="favs">${L2('فتح المفضلة','Open wishlist')} (${FAV.length})</button>`;
el.innerHTML=X+`<div class="uh"><div class="av">${esc((nm||user.email||'?').trim().charAt(0).toUpperCase())}</div><div style="min-width:0"><b>${esc(nm||L2('أهلاً بيك','Welcome'))}</b><br><small class="mut" dir="ltr">${esc(user.email||'')}</small></div><button class="lnk" style="margin:0" data-ac="out">${L2('خروج','Sign out')}</button></div>${pw&&!ver?`<div class="hint">✉️ ${L2('أكّد إيميلك من اللينك اللي بعتناه لك.','Please confirm your email using the link we sent.')} <button class="lnk" style="display:inline" data-ac="resend">${L2('إعادة إرسال','Resend')}</button> · <button class="lnk" style="display:inline" data-ac="reload">${L2('تم التأكيد','I confirmed')}</button></div>`:''}${ver&&pw?`<small style="color:#1a7f37">✓ ${L2('الإيميل مؤكد','Email verified')}</small>`:''}<div class="tg" style="margin-top:12px">${tabs.map(x=>`<button class="${AC.tab==x[0]?'on':''}" data-ac="tab:${x[0]}">${x[1]}</button>`).join('')}</div>${b}${AC.msg?`<p class="hint" role="status">${esc(AC.msg)}</p>`:''}`}
function openAcc(tab){if(tab)AC.tab=tab;AC.msg='';drawAcc();open('#acc');if(user)loadAccData()}
async function loadAccData(){if(!user||!db)return;try{const [q,u]=await Promise.all([db.collection('orders').where('uid','==',user.uid).get(),db.collection('users').doc(user.uid).get()]);AC.orders=q.docs.map(d=>d.data()).sort((a,b)=>b.t-a.t);if(u.exists)AC.prof=u.data()}catch(e){AC.orders=[]}if($('#acc').classList.contains('on'))drawAcc()}
async function onUser(u){const ab=$('#ab');if(ab)ab.classList.toggle('in',!!u);AC.orders=null;AC.prof=null;if(!u){drawAcc();return}
try{const d=await db.collection('users').doc(u.uid).get();const r=d.exists?d.data():{};AC.prof=r;
const remote=(r.fav||[]).map(Number).filter(Number.isFinite),merged=[...new Set([...FAV,...remote])];if(merged.length!=remote.length||merged.length!=FAV.length){FAV=merged;saveFav()}else{FAV=merged;favBadge()}
if(!cust.n&&(r.name||u.displayName))cust.n=r.name||u.displayName;if(!cust.p&&r.phone)cust.p=r.phone;if(!cust.a&&r.address)cust.a=r.address;if(cust.g<0&&Number.isInteger(r.g))cust.g=r.g;saveCust();drawCart()}catch(e){}
if($('#acc').classList.contains('on')){drawAcc();loadAccData()}}
async function acAct(a){if(a=='google'){const pr=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(pr);AC.msg='';closeAll();toast(L2('أهلاً بيك','Welcome'))}catch(e){if(e.code=='auth/popup-blocked'||e.code=='auth/operation-not-supported-in-this-environment'){try{await auth.signInWithRedirect(pr)}catch(x){AC.msg=aerr(x);drawAcc()}}else if(e.code!='auth/popup-closed-by-user'&&e.code!='auth/cancelled-popup-request'){AC.msg=aerr(e);drawAcc()}}}
else if(a=='m-in'||a=='m-up'){AC.mode=a=='m-up'?'up':'in';AC.msg='';drawAcc()}
else if(a=='forgot'){const em=($('#ae')||{}).value;if(!em){AC.msg=L2('اكتب الإيميل الأول','Enter your email first');drawAcc();return}try{await auth.sendPasswordResetEmail(em);AC.msg=L2('بعتنالك لينك تغيير الباسورد على إيميلك','Password reset link sent')}catch(e){AC.msg=aerr(e)}drawAcc()}
else if(a=='out'){await auth.signOut();AC.msg='';drawAcc();toast(L2('تم تسجيل الخروج','Signed out'))}
else if(a=='resend'){try{await user.sendEmailVerification();AC.msg=L2('بعتنا لينك التأكيد تاني','Verification link sent again')}catch(e){AC.msg=aerr(e)}drawAcc()}
else if(a=='reload'){try{await user.reload();AC.msg=user.emailVerified?'':L2('لسه ما اتأكدش، افتح اللينك من الإيميل','Not confirmed yet')}catch(e){}drawAcc()}
else if(a=='favs'){closeAll();favDraw();open('#fav')}
else if(a.startsWith('tab:')){AC.tab=a.slice(4);AC.msg='';drawAcc()}
else if(a.startsWith('trk:')){const id=a.slice(4),o=(AC.orders||[]).find(x=>x.id==id);closeAll();trackUI({id,p4:o&&o.phone?String(o.phone).slice(-4):''});if(o)trackGo()}}
document.addEventListener('submit',async e=>{const f=e.target;if(f.id=='af'){e.preventDefault();const em=$('#ae').value.trim(),pw=$('#ap').value;AC.busy=1;
try{if(AC.mode=='up'){const nm=($('#an').value||'').trim();const c=await auth.createUserWithEmailAndPassword(em,pw);if(nm)await c.user.updateProfile({displayName:nm});try{await c.user.sendEmailVerification()}catch(x){}
db.collection('users').doc(c.user.uid).set({name:nm,email:em},{merge:true}).catch(()=>{});AC.msg=L2('تم إنشاء الحساب! بعتنالك لينك تأكيد على إيميلك.','Account created! We sent a confirmation link to your email.');AC.tab='orders'}else{await auth.signInWithEmailAndPassword(em,pw);AC.msg=''}}catch(x){AC.msg=aerr(x)}AC.busy=0;drawAcc()}
else if(f.id=='pf'){e.preventDefault();const g=$('#pg').value,o={name:$('#pn').value.trim(),phone:$('#pp').value.trim(),address:$('#pa').value.trim(),g:g===''?null:+g};
try{await db.collection('users').doc(user.uid).set(o,{merge:true});AC.prof=Object.assign(AC.prof||{},o);cust.n=o.name||cust.n;cust.p=o.phone||cust.p;cust.a=o.address||cust.a;if(o.g!==null)cust.g=o.g;saveCust();drawCart();toast(L2('تم الحفظ','Saved'))}catch(x){toast(L2('تعذر الحفظ','Could not save'))}}});
/* ---- click router (runs before the main handler) ---- */
document.addEventListener('click',e=>{const T=e.target,g=s=>T.closest(s);let el;
if(el=g('[data-fv]')){e.stopPropagation();e.preventDefault();toggleFav(el.dataset.fv);return}

if(el=g('[data-accopen]')){e.stopPropagation();closeAll();openAcc(el.dataset.accopen||null);return}

favBadge();if(DEEP){const id=DEEP;DEEP=0;if(S.prods.some(p=>p.id==id&&!p.hide))product(id)}};
let DEEP=0;(function(){const h=location.hash,m=h.match(/^#p=(\d+)/),tk=h.match(/^#track=([\w-]+)/);if(m)DEEP=+m[1];if(tk)setTimeout(()=>trackUI({id:tk[1].toUpperCase()}),400)})();
